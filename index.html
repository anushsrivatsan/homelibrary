/* ---------- add / edit ---------- */
const opts = (list, sel, blank) => (blank ? `<option value="">${esc(blank)}</option>` : "") +
  list.map(x => `<option value="${esc(x.id)}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}</option>`).join("");
const seg = (name, values, sel) => `<div class="seg" role="radiogroup">${values.map((v, i) =>
  `<input type="radio" id="${name}${i}" name="${name}" value="${v}" ${v === sel ? "checked" : ""}><label for="${name}${i}">${v}</label>`).join("")}</div>`;

async function renderForm(editId) {
  let book = { read_status: "Unread", book_type: "Paperback", language: "English", owner_id: state.owners.find(o => o.is_default)?.id };
  let existingSrc = null;
  if (editId) {
    const { data, error } = await sb.from("books").select("*").eq("id", editId).single();
    if (error) throw error;
    book = data;
    if (book.image_path) existingSrc = (await signedUrls([book.image_path]))[book.image_path];
  }
  const carry = editId ? state.carry : null;   // details brought over from a duplicate scan
  state.carry = null;
  setBar({ title: editId ? "Edit item" : "Add item", back: true });
  if (!state.owners.length) {
    app.innerHTML = `<div class="empty">No owners set up yet. ${isAdmin() ? `<br><br><button class="btn" onclick="go('setup/owners')">Add owners in Setup</button>` : "Ask your admin to add owners in Setup."}</div>`;
    return;
  }
  const yr = new Date().getFullYear();
  app.innerHTML = `
    <h2>${editId ? "Edit item" : "Add to catalog"}</h2>
    <div class="notice" id="carryNote" hidden></div>
    <form id="bookForm" novalidate>
      <div class="field"><label for="owner">Owner</label><select id="owner" name="owner" required>${opts(state.owners, book.owner_id, "Choose owner")}</select></div>
      <div class="field"><label for="isbn">ISBN <span class="opt">(optional)</span></label>
        <div class="isbnrow">
          <input id="isbn" name="isbn" type="text" inputmode="numeric" autocomplete="off" value="${esc(book.isbn)}">
          <button class="btn ghost" type="button" id="scanBtn">Scan barcode</button>
          <button class="btn ghost" type="button" id="lookupBtn">Look up</button>
        </div>
        <div class="hint" id="lookupMsg">Scan or type an ISBN to fill in the title, author and cover.</div>
        <div class="elsewhere" id="elsewhere" hidden></div></div>
      <div class="field"><label for="title">Title</label><input id="title" name="title" type="text" value="${esc(book.title)}" required></div>
      <div class="field"><label for="author">Author</label><input id="author" name="author" type="text" value="${esc(book.author)}" required autocomplete="off"></div>
      <div class="row2">
        <div class="field"><label for="series">Series <span class="opt">(optional)</span></label><input id="series" name="series" type="text" value="${esc(book.series)}" autocomplete="off">
          <div class="hint" id="seriesHint" hidden></div></div>
        <div class="field"><label for="volume">Volume <span class="opt">(optional)</span></label><input id="volume" name="volume" type="text" placeholder="e.g. 2, III, Part 1" value="${esc(book.volume)}" autocomplete="off">
          <div class="hint" id="volHint" hidden></div></div>
      </div>
      <div class="field"><label for="publisher">Publisher <span class="opt">(optional)</span></label><input id="publisher" name="publisher" type="text" value="${esc(book.publisher)}" autocomplete="off"></div>
      <div class="row2">
        <div class="field"><label for="year">Published year</label><input id="year" name="year" type="number" inputmode="numeric" min="1000" max="${yr + 1}" value="${esc(book.published_year)}"></div>
        <div class="field"><label for="language">Language</label><select id="language" name="language">${
          [...new Set([...LANGUAGES, book.language].filter(Boolean))].map(l => `<option ${l === book.language ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><span class="legend">Read status</span>${seg("status", READ_STATUSES, book.read_status)}</div>
      <div class="field"><span class="legend">Type</span>${seg("btype", BOOK_TYPES, book.book_type)}</div>
      <div class="field"><label for="genre">Genre <span class="opt">(optional)</span></label><select id="genre" name="genre"><option value="">Not set</option>${
        [...new Set([...GENRES, book.genre].filter(Boolean))].map(g => `<option ${g === book.genre ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></div>
      <div class="row2">
        <div class="field"><label for="room">Room</label><select id="room" name="room">${opts(state.rooms, book.room_id, "Not shelved yet")}</select></div>
        <div class="field"><label for="area">Area</label><select id="area" name="area"></select></div>
      </div>
      <div class="field"><label for="img">Photo <span class="opt">(optional)</span></label>
        <input id="img" type="file" accept="image/*">
        <div class="hint" id="photoHint">Choose a photo, or scan an ISBN to find the cover. Large photos are resized before upload.</div></div>

      <section class="previewbox" aria-labelledby="pvTitle">
        <h3 id="pvTitle">Preview</h3>
        <div id="pv"></div>
        <div class="covers" id="coverPick" hidden>
          <span class="flabel" id="coverLabel">Covers found. Tap to choose</span>
          <div class="cstrip" id="coverStrip"></div>
        </div>
        <div class="pvactions">
          <button class="btn ghost small" type="button" id="findCover" hidden>Find cover online</button>
          <button class="btn danger small" type="button" id="delImg" hidden>Delete image</button>
          <button class="btn ghost small" type="button" id="keepOld" hidden>Keep the current image</button>
        </div>
      </section>

      <div class="err" id="formErr" role="alert"></div>
      <div class="actions">
        <button class="btn" type="submit">${editId ? "Save changes" : "Add to catalog"}</button>
        <button class="btn ghost" type="button" id="cancel">Cancel</button>
      </div>
    </form>`;

  const f = document.getElementById("bookForm");
  const msgEl = document.getElementById("lookupMsg"), photoHint = document.getElementById("photoHint");
  const fillAreas = sel => {
    const rid = f.room.value, list = state.areas.filter(a => a.room_id === rid);
    f.area.innerHTML = rid ? opts(list, sel, list.length ? "Any area" : "No areas in this room") : `<option value="">Pick a room first</option>`;
    f.area.disabled = !rid;
  };
  fillAreas(book.area_id);
  f.room.onchange = () => fillAreas();

  /* ----- photo state: existing | file | auto (cover found online) | none ----- */
  let photo = book.image_path ? { kind: "existing", src: existingSrc } : { kind: "none" };
  const setPhoto = p => { photo = p; renderPreview(); };

  /* ----- live preview ----- */
  const renderPreview = () => {
    const room = byId(state.rooms, f.room.value)?.name, area = byId(state.areas, f.area.value)?.name;
    const loc = [room, area].filter(Boolean).join(" / ") || "Not shelved yet";
    const status = f.status.value, isbn = cleanIsbn(f.isbn.value);
    const src = photo.kind === "none" ? null : photo.src;
    document.getElementById("pv").innerHTML = `
      <article class="sheet">
        <div class="hero">
          ${src ? `<img src="${esc(src)}" alt="Book image">` : `<div class="noimg">No image</div>`}
          <div><h2>${esc(f.title.value.trim()) || '<span class="stat">Title</span>'}</h2>
            <div class="stat">${esc(f.author.value.trim()) || "Author"}</div>
            ${photo.kind === "auto" ? `<div class="hint">Cover from ${esc(photo.cover.source)}</div>` : ""}</div>
        </div>
        <dl class="kv">
          <dt>Location</dt><dd>${esc(loc)}</dd>
          <dt>Owner</dt><dd>${esc(byId(state.owners, f.owner.value)?.name) || "—"}</dd>
          <dt>Series</dt><dd>${esc(f.series.value.trim()) || "—"}</dd>
          <dt>Volume</dt><dd>${esc(f.volume.value.trim()) || "—"}</dd>
          <dt>Publisher</dt><dd>${esc(f.publisher.value.trim()) || "—"}</dd>
          <dt>Published</dt><dd>${esc(f.year.value) || "—"}</dd>
          <dt>ISBN</dt><dd>${esc(isbn) || "—"}</dd>
          <dt>Language</dt><dd>${esc(f.language.value)}</dd>
          <dt>Genre</dt><dd>${esc(f.genre.value) || "—"}</dd>
          <dt>Read status</dt><dd><span class="pill ${esc(status)}">${esc(status)}</span></dd>
          <dt>Type</dt><dd>${esc(f.btype.value)}</dd>
        </dl>
      </article>`;
    document.getElementById("delImg").hidden = !src;
    document.getElementById("findCover").hidden = !!src || !(f.title.value.trim() || isValidIsbn(cleanIsbn(f.isbn.value)));
    renderCovers();
    document.getElementById("keepOld").hidden = !(book.image_path && photo.kind !== "existing");
  };
  /* ----- suggestions from books already in the catalog ----- */
  const seriesVolumes = () => state.sugg?.bySeries[f.series.value.trim().toLowerCase()] || null;
  const volumeItems = () => {
    const have = seriesVolumes();
    if (!have) return state.sugg?.vols || [];
    const nums = have.map(v => parseInt(v, 10)).filter(n => !isNaN(n));
    return [...new Set([nums.length ? String(Math.max(...nums) + 1) : "", ...have].filter(Boolean))];   // next number first
  };
  const volHint = () => {
    const have = seriesVolumes(), hint = document.getElementById("volHint");
    hint.hidden = !have;
    if (have) { const next = volumeItems()[0]; hint.textContent = `This series has ${have.length === 1 ? "volume" : "volumes"} ${have.join(", ")}${next && !have.includes(next) ? `. Next: ${next}` : ""}.`; }
  };
  const suggStatus = what => q => {
    if (state.suggStatus === "loading" || !state.suggStatus) return "Loading saved names…";
    if (state.suggStatus !== "ok") return state.suggStatus;
    if (q) return "";                                    // typing something new: nothing to say
    return `No ${what} saved yet in ${state.sugg.books} book${state.sugg.books === 1 ? "" : "s"}. Names appear here once books have one.`;
  };
  const pubSuggest = attachSuggest(f.publisher, () => state.sugg?.pubs || [], suggStatus("publishers"));
  const authSuggest = attachSuggest(f.author, () => state.sugg?.authors || [], suggStatus("authors"));
  // Series: this author's series first, then everything else
  const seriesItems = () => {
    const mine = state.sugg?.authorSeries[f.author.value.trim().toLowerCase()] || [];
    return [...new Set([...mine, ...(state.sugg?.series || [])])];
  };
  const serSuggest = attachSuggest(f.series, seriesItems, suggStatus("series"));
  // Known series: fill in its usual author and publisher, but only into empty fields
  const fillFromSeries = () => {
    const info = state.sugg?.seriesInfo[f.series.value.trim().toLowerCase()];
    const hint = document.getElementById("seriesHint");
    if (!info) { hint.hidden = true; return; }
    const filled = [];
    if (info.author && !f.author.value.trim()) { f.author.value = info.author; filled.push("author"); }
    if (info.publisher && !f.publisher.value.trim()) { f.publisher.value = info.publisher; filled.push("publisher"); }
    if (filled.length) {
      hint.hidden = false;
      hint.textContent = `Filled ${filled.join(" and ")} from other books in this series. Change them if needed.`;
      touched.add("author"); renderPreview();
    }
  };
  f.series.addEventListener("change", fillFromSeries);   // fires when a suggestion is picked or the field is left
  f.series.addEventListener("input", () => { if (seriesItems().some(v => v.toLowerCase() === f.series.value.trim().toLowerCase())) fillFromSeries(); });
  if (!state.sugg) state.suggStatus = "loading";
  f.series.addEventListener("input", volHint);
  loadSuggestions().then(() => { volHint(); [pubSuggest, authSuggest, serSuggest].forEach(x => x.refresh()); });

  const touched = new Set();
  f.addEventListener("input", e => { touched.add(e.target.name); renderPreview(); });
  f.addEventListener("change", e => { touched.add(e.target.name); renderPreview(); });

  document.getElementById("delImg").onclick = () => {
    f.img.value = "";
    setPhoto({ kind: "none" });
    photoHint.textContent = book.image_path ? "Image will be deleted when you save." : "No image. Choose a photo if you want one.";
  };
  document.getElementById("keepOld").onclick = () => {
    f.img.value = "";
    setPhoto({ kind: "existing", src: existingSrc });
    photoHint.textContent = "Keeping the current image.";
  };
  f.img.onchange = () => {
    const file = f.img.files[0];
    if (file) { setPhoto({ kind: "file", file, src: URL.createObjectURL(file) }); photoHint.textContent = "Your photo will be used."; }
  };

  /* ----- online cover ----- */
  let coverOptions = [];
  const renderCovers = () => {
    const box = document.getElementById("coverPick");
    box.hidden = coverOptions.length < 2;            // one cover: just use it; several: let them pick
    if (box.hidden) return;
    document.getElementById("coverLabel").textContent = `${coverOptions.length} covers found. Tap to choose`;
    document.getElementById("coverStrip").innerHTML = coverOptions.map((c, i) => {
      const on = photo.kind === "auto" && photo.cover.url === c.url;
      return `<button type="button" class="cthumb" data-i="${i}" aria-pressed="${on}" title="${esc(c.source)}"><img src="${esc(c.url)}" alt="Cover option ${i + 1} from ${esc(c.source)}"></button>`;
    }).join("");
    document.querySelectorAll("#coverStrip .cthumb").forEach(b => b.onclick = () => {
      const c = coverOptions[+b.dataset.i];
      f.img.value = "";
      setPhoto({ kind: "auto", cover: c, src: c.url });
      photoHint.textContent = `Cover from ${c.source}. It's saved with the item when you tap Save.`;
    });
  };
  // Look for covers, but only when the item has no image yet; never replaces a photo
  const getCover = async (seeds = [], manual = false) => {
    if (photo.kind !== "none") return;
    const isbn = cleanIsbn(f.isbn.value);
    const btn = document.getElementById("findCover");
    const job = findCoverOptions({ isbn: isValidIsbn(isbn) ? isbn : "", title: f.title.value.trim(), author: f.author.value.trim(), seeds });
    coverOptions = manual ? await busy(btn, () => job) : await job;
    if (photo.kind !== "none") { renderCovers(); return; }   // a photo was chosen meanwhile
    if (!coverOptions.length) {
      photoHint.textContent = "No cover found online. Choose a photo if you want one.";
      if (manual) toast("No cover found online");
      renderPreview(); return;
    }
    const c = coverOptions[0];
    setPhoto({ kind: "auto", cover: c, src: c.url });
    photoHint.textContent = coverOptions.length > 1
      ? `Cover from ${c.source}. ${coverOptions.length - 1} other option${coverOptions.length > 2 ? "s" : ""} in the preview.`
      : `Cover found on ${c.source}. Delete it in the preview, or choose your own photo.`;
    msgEl.textContent += (msgEl.textContent ? " " : "") + (coverOptions.length > 1 ? `${coverOptions.length} covers found.` : "Cover found.");
  };
  document.getElementById("findCover").onclick = () => getCover([], true);

  /* ----- duplicates ----- */
  let dupDecided = null;   // which ISBN/title the person already said "add a copy" for
  const formKey = () => {
    const isbn = cleanIsbn(f.isbn.value);
    return isbn ? "i:" + isbn : "t:" + [f.title, f.author, f.volume].map(el => el.value.trim().toLowerCase()).join("|");
  };
  const collectCarry = () => {
    const c = {};
    const isbn = cleanIsbn(f.isbn.value);
    if (isbn) c.isbn = isbn;
    if (f.title.value.trim()) c.title = f.title.value.trim();
    if (f.author.value.trim()) c.author = f.author.value.trim();
    if (f.year.value) c.year = f.year.value;
    if (f.publisher.value.trim()) c.publisher = f.publisher.value.trim();
    if (f.genre.value) c.genre = f.genre.value;
    for (const k of touched) {
      if (k === "series") c.series = f.series.value.trim();
      if (k === "volume") c.volume = f.volume.value.trim();
      if (k === "year") c.year = f.year.value;
      if (k === "owner") c.owner = f.owner.value;
      if (k === "language") c.language = f.language.value;
      if (k === "genre") c.genre = f.genre.value;
      if (k === "status") c.status = f.status.value;
      if (k === "btype") c.btype = f.btype.value;
      if (k === "room" || k === "area") { c.room = f.room.value; c.area = f.area.value; }
    }
    if (photo.kind === "auto" || photo.kind === "file") c.photo = photo;
    return c;
  };
  // Returns true to carry on, false to stop (cancelled, or moved to edit the existing item)
  const checkDuplicates = async () => {
    if (editId) return true;
    const isbn = cleanIsbn(f.isbn.value), title = f.title.value.trim(), author = f.author.value.trim();
    if (!isbn && !(title && author)) return true;
    const key = formKey();
    if (dupDecided === key) return true;
    const dups = await findDuplicates({ isbn, title, author, volume: f.volume.value.trim() });
    if (!dups.length) { dupDecided = key; return true; }
    const choice = await chooseDuplicate(dups, isbn ? "This ISBN" : "A book with this title and author");
    if (choice === "copy") { dupDecided = key; return true; }
    if (choice?.startsWith("edit:")) { state.carry = collectCarry(); go("edit/" + choice.slice(5)); }
    return false;
  };

  /* ----- ISBN lookup ----- */
  const fillFromIsbn = async () => {
    const isbn = cleanIsbn(f.isbn.value);
    if (!isValidIsbn(isbn)) { msgEl.textContent = "Enter a valid 10 or 13 digit ISBN first."; return; }
    f.isbn.value = isbn;
    await busy(document.getElementById("lookupBtn"), async () => {
      msgEl.textContent = "Looking up…";
      let hit;
      try { hit = await lookupIsbn(isbn); }
      catch { hit = { covers: [] }; }   // never leave the form stuck on "Looking up…"
      // Always offer the other sites after a lookup: not found, partly found (e.g. no author), or a wrong match
      showElsewhere(isbn, !hit.title ? "Search elsewhere:" : !hit.author ? "Author missing? Search elsewhere:" : "Not the right book? Check:");
      if (!hit.title) msgEl.textContent = "Not found in Google Books, Open Library or Crossref. Search one of these sites, then type the title and author.";
      else {
        const found = [["Title", f.title, hit.title], ["Author", f.author, hit.author], ["Publisher", f.publisher, hit.publisher], ["Published year", f.year, hit.year], ["Genre", f.genre, hit.genre]]
          .filter(([, , v]) => v);
        // only ask when it would overwrite something different that's already typed in
        const clashes = found.filter(([, el, v]) => el.value.trim() && el.value.trim() !== String(v));
        if (!clashes.length || confirm(`Replace with what was found?\n\n${clashes.map(([l, el, v]) => `${l}: ${el.value.trim()} → ${v}`).join("\n")}`)) {
          found.forEach(([, el, v]) => (el.value = v));
          msgEl.textContent = `Filled ${found.map(([l]) => l.toLowerCase()).join(", ")} from ${hit.source}. Check before saving.`;
        } else msgEl.textContent = "Kept what you typed.";
      }
      renderPreview();
      await getCover(hit.covers);
    });
    await checkDuplicates();
  };
  // One-tap searches on sites the app can't read directly; each opens in a new tab with the ISBN searched
  const showElsewhere = (isbn, label = "Search elsewhere:") => {
    const box = document.getElementById("elsewhere");
    box.hidden = !isbn;
    if (!isbn) { box.innerHTML = ""; return; }
    const sites = [
      ["WorldCat", `https://search.worldcat.org/search?q=bn:${isbn}`],
      ["Bookshop", `https://bookshop.org/search?keywords=${isbn}`],
      ["Biblio", `https://www.biblio.com/${isbn}`],
    ];
    box.innerHTML = `<span>${esc(label)}</span>` + sites.map(([name, url]) =>
      `<a class="extlink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${name} <span aria-hidden="true">↗</span><span class="sr"> (opens in a new tab)</span></a>`).join("");
  };
  f.isbn.addEventListener("input", () => showElsewhere(""));
  document.getElementById("lookupBtn").onclick = fillFromIsbn;
  f.isbn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); fillFromIsbn(); } };
  document.getElementById("scanBtn").onclick = async () => {
    const code = await scanBarcode();
    if (code) { f.isbn.value = code; fillFromIsbn(); }
  };
  document.getElementById("cancel").onclick = () => history.back();

  /* ----- details brought over from "Edit & overwrite" ----- */
  if (carry) {
    const changed = [];
    const setVal = (el, v, label, old) => { if (v === undefined) return; el.value = v; if (String(old ?? "") !== String(v ?? "")) changed.push(label); };
    setVal(f.isbn, carry.isbn, "ISBN", book.isbn);
    setVal(f.title, carry.title, "Title", book.title);
    setVal(f.author, carry.author, "Author", book.author);
    setVal(f.series, carry.series, "Series", book.series);
    setVal(f.volume, carry.volume, "Volume", book.volume);
    setVal(f.year, carry.year, "Published year", book.published_year);
    setVal(f.publisher, carry.publisher, "Publisher", book.publisher);
    setVal(f.genre, carry.genre, "Genre", book.genre);
    setVal(f.owner, carry.owner, "Owner", book.owner_id);
    setVal(f.language, carry.language, "Language", book.language);
    if (carry.status) { f.querySelector(`input[name=status][value="${carry.status}"]`).checked = true; if (carry.status !== book.read_status) changed.push("Read status"); }
    if (carry.btype) { f.querySelector(`input[name=btype][value="${carry.btype}"]`).checked = true; if (carry.btype !== book.book_type) changed.push("Type"); }
    if (carry.room !== undefined) {
      f.room.value = carry.room; fillAreas(carry.area);
      if ((carry.room || null) !== book.room_id || (carry.area || null) !== book.area_id) changed.push("Location");
    }
    if (carry.photo) { photo = carry.photo; changed.push("Image"); photoHint.textContent = "New image from your scan. Use the preview to keep the current one or delete it."; }
    const note = document.getElementById("carryNote");
    note.hidden = false;
    note.innerHTML = changed.length
      ? `<strong>Overwriting the existing item.</strong> Updated from your scan: ${esc(changed.join(", "))}. Check the preview, then tap Save changes.`
      : `<strong>Editing the existing item.</strong> Your scan matched what's already saved.`;
  }
  renderPreview();

  /* ----- save ----- */
  f.onsubmit = async e => {
    e.preventDefault();
    const errEl = document.getElementById("formErr"); errEl.textContent = "";
    const isbn = cleanIsbn(f.isbn.value);
    const year = f.year.value ? parseInt(f.year.value, 10) : null;
    const problems = [];
    if (!f.owner.value) problems.push("Choose an owner.");
    if (!f.title.value.trim()) problems.push("Enter a title.");
    if (!f.author.value.trim()) problems.push("Enter an author.");
    if (year !== null && (year < 1000 || year > yr + 1)) problems.push(`Published year must be between 1000 and ${yr + 1}.`);
    if (isbn && !/^(\d{9}[\dX]|\d{13})$/.test(isbn)) problems.push("ISBN must be 10 or 13 digits.");
    if (problems.length) { errEl.textContent = problems.join(" "); return; }

    await busy(f.querySelector("button[type=submit]"), async () => {
      try {
        if (!(await checkDuplicates())) return;
        const oldPath = book.image_path || null;
        let image_path = oldPath;
        const upload = async blob => {
          const path = `books/${uuid()}.jpg`;
          const { error } = await sb.storage.from(IMAGE_BUCKET).upload(path, await compressImage(blob), { contentType: "image/jpeg" });
          if (error) throw error;
          return path;
        };
        if (photo.kind === "none") image_path = null;
        else if (photo.kind === "file") image_path = await upload(photo.file);
        else if (photo.kind === "auto") {
          const blob = photo.cover.blob || await downloadCover(photo.cover.url);
          if (blob) { try { image_path = await upload(blob); } catch { image_path = photo.cover.url; } }
          else image_path = photo.cover.url;   // site blocks downloads: link to it
        }
        const row = {
          owner_id: f.owner.value, title: f.title.value.trim(), author: f.author.value.trim(),
          series: f.series.value.trim() || null, volume: f.volume.value.trim() || null, publisher: f.publisher.value.trim() || null, published_year: year, isbn: isbn || null,
          read_status: f.status.value, book_type: f.btype.value, language: f.language.value, genre: f.genre.value || null,
          room_id: f.room.value || null, area_id: f.area.value || null, image_path,
        };
        const res = editId
          ? await sb.from("books").update(row).eq("id", editId).select("id").single()
          : await sb.from("books").insert(row).select("id").single();
        if (res.error) throw res.error;
        if (oldPath && oldPath !== image_path && !isExternal(oldPath)) sb.storage.from(IMAGE_BUCKET).remove([oldPath]); // best effort
        state.sugg = null;   // include this book's publisher/volume in suggestions next time
        toast(editId ? "Changes saved" : "Added to catalog");
        if (editId) { history.replaceState(null, "", "#book/" + editId); route(); }
        else {
          // Keep owner/room/area for fast shelf-by-shelf entry
          const keep = { owner: f.owner.value, room: f.room.value, area: f.area.value };
          await renderForm();
          const nf = document.getElementById("bookForm");
          nf.owner.value = keep.owner; nf.room.value = keep.room; nf.room.onchange(); nf.area.value = keep.area;
          nf.dispatchEvent(new Event("change"));
          // Back to the top, with a note of what was just added, ready for the next book
          const note = document.getElementById("carryNote");
          note.hidden = false; note.classList.add("ok");
          note.innerHTML = `<strong>Added “${esc(row.title)}”.</strong> Ready for the next one.`;
          window.scrollTo({ top: 0, behavior: "smooth" });
          // Put the cursor in ISBN on computers; skip on phones so the keyboard doesn't cover the Scan button
          if (matchMedia("(pointer: fine)").matches) nf.isbn.focus({ preventScroll: true });
        }
      } catch (err) { errEl.textContent = friendly(err); }
    });
  };
}

/* ---------- bulk cover finder (Setup → Covers) ---------- */
// Loose text comparison: ignores case, accents, punctuation and bracketed notes like "(Kindle Edition)"
const normText = s => (s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\(.*?\)|\[.*?\]/g, " ").replace(/[^a-z0-9]+/g, " ").trim();
// Volume markers in a title: "Volume 1", "Vol. II", "Part Three", "Book 2" → number
const VOL_RE = /\b(?:vol(?:ume)?|part|book|bk)\.?\s*(\d+|[ivxlc]+|one|two|three|four|five|six|seven|eight|nine|ten)\b/i;
function volNumber(v) {
  if (!v) return "";
  v = String(v).toLowerCase().trim();
  const words = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };
  if (words[v]) return String(words[v]);
  if (/^\d+$/.test(v)) return String(+v);
  if (/^[ivxlc]+$/.test(v)) {                                      // roman numerals
    const r = { i: 1, v: 5, x: 10, l: 50, c: 100 }; let n = 0;
    for (let i = 0; i < v.length; i++) n += r[v[i]] < (r[v[i + 1]] || 0) ? -r[v[i]] : r[v[i]];
    return String(n);
  }
  const m = v.match(VOL_RE); return m ? volNumber(m[1]) : "";
}
// The core title used to search and compare: before any subtitle, without "Volume N", "(Kindle Edition)" etc.
function coreTitle(t) {
  return String(t || "").split(/\s*[:;]\s*|\s+[-–—]\s+/)[0]
    .replace(/\(.*?\)|\[.*?\]/g, " ").replace(VOL_RE, " ").replace(/[,.\s]+$/, "").replace(/\s+/g, " ").trim();
}
// Same book if the core titles match (subtitle, leading "The/A/An" and volume markers ignored).
// "Harry Potter" does NOT match "Harry Potter and the Chamber of Secrets" (different book in the series).
function titleMatches(want, got) {
  const core = t => normText(coreTitle(t)).replace(/^(the|a|an) /, "");
  const a = core(want), b = core(got);
  return !!a && !!b && a === b;
}
function authorMatches(want, gotList) {
  const words = normText(want).split(" ").filter(w => w.length >= 3);
  if (!words.length) return true;                                     // no author to check against
  const got = normText((gotList || []).join(" "));
  return words.some(w => got.split(" ").includes(w));                 // shares a surname / name
}
// Best single cover for a catalogued book. Only accepts results whose title and author match.
// Returns { url, source, how, note? }, or { busy: true } if the services kept refusing, or null if not found.
async function findBestCover(book) {
  const tryList = async list => { for (const c of list) { if (await probeImage(c.url)) return c; } return null; };
  let busy = false;
  // Fetch JSON; if the service says "too many requests" (429) or is down (5xx), wait and retry
  const getJSON = async url => {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await Promise.race([fetch(url), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
        if (r.ok) return await r.json();
        if (r.status !== 429 && r.status < 500) return null;      // a real "no", not worth retrying
      } catch {}
      await new Promise(res => setTimeout(res, 2000 * (attempt + 1)));
    }
    busy = true; return null;
  };

  const isbn = cleanIsbn(book.isbn);
  if (isValidIsbn(isbn)) {                                          // exact edition first
    const hit = await lookupIsbn(isbn).catch(() => null);
    const c = hit && await tryList(hit.covers || []);
    if (c) return { ...c, how: "ISBN" };
  }

  // Search with the core title ("A History of India", not "A History of India: Volume 1"), and only the first author
  const core = coreTitle(book.title) || book.title;
  const author = (book.author || "").split(/,|&| and /)[0].trim();
  const wantVol = volNumber(book.volume) || volNumber((String(book.title).match(VOL_RE) || [])[0]);
  const t = encodeURIComponent(core), a = encodeURIComponent(author);
  const [ol, gb] = await Promise.all([
    getJSON(`https://openlibrary.org/search.json?title=${t}${a ? `&author=${a}` : ""}&fields=title,subtitle,author_name,cover_i&limit=20`),
    getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(`intitle:"${core}"`)}${a ? `+inauthor:${a}` : ""}&maxResults=15`),
  ]);
  const cands = [
    ...(ol?.docs || []).filter(d => d.cover_i && titleMatches(core, d.title) && authorMatches(book.author, d.author_name))
      .map(d => ({ url: `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`, source: "Open Library", full: [d.title, d.subtitle].join(" ") })),
    ...(gb?.items || []).map(i => i.volumeInfo).filter(v => v?.imageLinks?.thumbnail && titleMatches(core, v.title) && authorMatches(book.author, v.authors))
      .map(v => ({ url: v.imageLinks.thumbnail.replace(/^http:/, "https:").replace("&edge=curl", ""), source: "Google Books", full: [v.title, v.subtitle].join(" ") })),
  ];
  // Multi-volume works: covers that name the same volume first; others only if none do
  const volOf = c => volNumber((c.full.match(VOL_RE) || [])[0]);
  const exact = wantVol ? cands.filter(c => volOf(c) === wantVol) : cands;
  const other = wantVol ? cands.filter(c => !volOf(c)) : [];       // never use a cover that names a different volume
  let c = await tryList(exact.slice(0, 6));
  if (c) return { ...c, how: wantVol ? `title + author, volume ${wantVol}` : "title + author" };
  c = await tryList(other.slice(0, 4));
  if (c) return { ...c, how: "title + author", note: `volume ${wantVol} not confirmed` };
  return busy ? { busy: true } : null;
}

async function renderCoversTab(pane) {
  const countMissing = async type => {
    let q = sb.from("books").select("id", { count: "exact", head: true }).is("image_path", null);
    if (type) q = q.eq("book_type", type);
    return (await q).count ?? 0;
  };
  const total = await countMissing("");
  pane.innerHTML = `
    <p class="lead">Finds a cover online for books that have no image, using the ISBN when there is one, otherwise the title and author.
      Only covers whose title and author match are used. Books with an image are never changed.</p>
    <div class="field"><label for="cvType">Which books</label>
      <select id="cvType"><option value="">All books without an image (${total})</option>
        ${BOOK_TYPES.map(t => `<option value="${t}">${t}s without an image</option>`).join("")}</select></div>
    <div class="actions" style="margin-top:0">
      <button class="btn" id="cvStart" ${total ? "" : "disabled"}>Find covers</button>
      <button class="btn ghost" id="cvStop" hidden>Stop</button>
    </div>
    <div id="cvProgress" hidden>
      <progress id="cvBar" value="0" max="1" style="width:100%;height:10px;margin-top:1rem"></progress>
      <p class="stat" id="cvStat"></p>
    </div>
    <ul class="list covlog" id="cvLog" hidden></ul>`;
  const $ = id => document.getElementById(id);
  const updateCount = async () => {
    const n = await countMissing($("cvType").value);
    $("cvStart").disabled = !n;
    $("cvStart").textContent = n ? `Find covers (${n})` : "Nothing to do";
  };
  $("cvType").onchange = () => { $("cvProgress").hidden = true; $("cvLog").hidden = true; return updateCount(); };
  updateCount();

  let stop = false;
  $("cvStop").onclick = () => { stop = true; $("cvStop").disabled = true; $("cvStat").textContent += " Stopping after the current books…"; };
  $("cvStart").onclick = async () => {
    stop = false;
    const type = $("cvType").value;
    // all books without an image (in pages of 1,000)
    let books = [];
    for (let from = 0; ; from += 1000) {
      let q = sb.from("books").select("id,title,author,isbn,volume").is("image_path", null).order("title").range(from, from + 999);
      if (type) q = q.eq("book_type", type);
      const { data, error } = await q;
      if (error) { toast(friendly(error), true); return; }
      books = books.concat(data);
      if (data.length < 1000) break;
    }
    if (!books.length) return;
    $("cvStart").hidden = true; $("cvType").disabled = true;
    $("cvStop").hidden = false; $("cvStop").disabled = false;
    $("cvProgress").hidden = false; $("cvLog").hidden = false; $("cvLog").innerHTML = "";
    $("cvBar").max = books.length; $("cvBar").value = 0;
    const tally = { saved: 0, linked: 0, none: 0, busy: 0, error: 0 };
    const stat = () => $("cvStat").textContent =
      `${$("cvBar").value} of ${books.length} checked: ${tally.saved + tally.linked} covers added, ${tally.none} not found${tally.busy ? `, ${tally.busy} skipped (services busy)` : ""}${tally.error ? `, ${tally.error} errors` : ""}.`;

    const one = async b => {
      const row = document.createElement("li");
      row.innerHTML = `<span class="noimg small"></span><span class="name">${esc(b.title)}<br><span class="stat">${esc(b.author)}</span></span><span class="stat">Searching…</span>`;
      $("cvLog").prepend(row);
      const status = row.lastElementChild;
      try {
        const c = await findBestCover(b);
        if (c?.busy) { tally.busy++; status.textContent = "Book services busy. Run again later to retry this one."; return; }
        if (!c) { tally.none++; status.innerHTML = `Not found · <a href="#edit/${esc(b.id)}">add manually</a>`; return; }
        // store it in your photo storage when the site allows downloading; otherwise link to it
        let image_path = c.url, saved = false;
        const blob = await downloadCover(c.url);
        if (blob) {
          const path = `books/${uuid()}.jpg`;
          const up = await sb.storage.from(IMAGE_BUCKET).upload(path, await compressImage(blob), { contentType: "image/jpeg" });
          if (!up.error) { image_path = path; saved = true; }
        }
        const { data, error } = await sb.from("books").update({ image_path }).eq("id", b.id).is("image_path", null).select("id");
        if (error) throw error;
        if (!data.length) { status.textContent = "Skipped: an image was added meanwhile"; if (saved) sb.storage.from(IMAGE_BUCKET).remove([image_path]); return; }
        saved ? tally.saved++ : tally.linked++;
        row.firstElementChild.outerHTML = `<img class="cvthumb" src="${esc(c.url)}" alt="">`;
        status.innerHTML = `Added from ${esc(c.source)} (${esc(c.how)})${c.note ? ` · <strong>${esc(c.note)}</strong>` : ""} · <a href="#edit/${esc(b.id)}">change</a>`;
      } catch (e) { tally.error++; status.textContent = "Error: " + friendly(e); }
      finally { $("cvBar").value++; stat(); }
    };

    // two at a time, with a short pause, to be gentle on the free book databases
    let next = 0;
    const worker = async () => {
      while (!stop && next < books.length) { await one(books[next++]); await new Promise(r => setTimeout(r, 300)); }
    };
    await Promise.all([worker(), worker()]);
    stat();
    $("cvStat").textContent += stop ? " Stopped. Run again to continue with the rest." : " Done.";
    $("cvStop").hidden = true; $("cvStart").hidden = false; $("cvType").disabled = false;
    updateCount();   // books still without a cover (keeps the results on screen)
  };
}

/* ---------- suggestion dropdown (works in every browser and in the phone apps) ---------- */
function attachSuggest(input, getItems, statusText = () => "") {
  const box = document.createElement("ul");
  box.className = "sgbox"; box.id = input.id + "Sg"; box.hidden = true; box.setAttribute("role", "listbox");
  input.parentElement.classList.add("sgwrap");
  input.after(box);
  input.setAttribute("role", "combobox"); input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-controls", box.id); input.setAttribute("aria-expanded", "false");
  let items = [], active = -1, picking = false;
  const mark = (v, q) => {
    const i = q ? v.toLowerCase().indexOf(q) : -1;
    return i < 0 ? esc(v) : esc(v.slice(0, i)) + "<b>" + esc(v.slice(i, i + q.length)) + "</b>" + esc(v.slice(i + q.length));
  };
  const close = () => { box.hidden = true; active = -1; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); };
  const render = () => {
    if (document.activeElement !== input) return close();
    const q = input.value.trim().toLowerCase();
    const all = getItems();
    items = (q
      ? all.filter(v => v.toLowerCase().includes(q) && v.toLowerCase() !== q)
           .sort((a, b) => b.toLowerCase().startsWith(q) - a.toLowerCase().startsWith(q))   // "starts with" first
      : all).slice(0, 8);
    if (!items.length) {
      // Nothing to suggest: say why (still loading, couldn't load, or nothing saved yet) instead of staying silent
      const msg = statusText(q);
      if (!msg) return close();
      items = []; active = -1;
      box.innerHTML = `<li class="sgnote" aria-disabled="true">${esc(msg)}</li>`;
      box.hidden = false; input.setAttribute("aria-expanded", "true");
      return;
    }
    active = -1;
    box.innerHTML = items.map((v, i) => `<li role="option" id="${box.id}-${i}" data-i="${i}">${mark(v, q)}</li>`).join("");
    box.hidden = false; input.setAttribute("aria-expanded", "true");
  };
  const pick = i => {
    input.value = items[i];
    picking = true; input.dispatchEvent(new Event("input", { bubbles: true })); picking = false;   // updates the preview
    close();
  };
  const move = d => {
    active = (active + d + items.length) % items.length;
    box.querySelectorAll("li").forEach((li, i) => li.classList.toggle("on", i === active));
    input.setAttribute("aria-activedescendant", `${box.id}-${active}`);
    box.children[active]?.scrollIntoView?.({ block: "nearest" });
  };
  input.addEventListener("input", () => { if (!picking) render(); });
  input.addEventListener("focus", render);
  input.addEventListener("blur", () => setTimeout(close, 120));
  input.addEventListener("keydown", e => {
    if (box.hidden) { if (e.key === "ArrowDown") { render(); e.preventDefault(); } return; }
    if (e.key === "ArrowDown") { move(1); e.preventDefault(); }
    else if (e.key === "ArrowUp") { move(-1); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { pick(active); e.preventDefault(); }
    else if (e.key === "Escape") { close(); e.preventDefault(); }
  });
  // pointerdown (not click) so the choice lands before the field loses focus
  box.addEventListener("pointerdown", e => { const li = e.target.closest("li[data-i]"); e.preventDefault(); if (li) pick(+li.dataset.i); });
  return { refresh: render };
}

/* ---------- suggestions (publisher, volume) ---------- */
// Count values case-insensitively, keep the most used spelling, most common first
function tally(values) {
  const m = new Map();
  for (const raw of values) {
    const v = (raw || "").trim(); if (!v) continue;
    const k = v.toLowerCase(), e = m.get(k) || { n: 0, forms: new Map() };
    e.n++; e.forms.set(v, (e.forms.get(v) || 0) + 1); m.set(k, e);
  }
  return [...m.values()].sort((a, b) => b.n - a.n)
    .map(e => [...e.forms.entries()].sort((a, b) => b[1] - a[1])[0][0]);
}
async function loadSuggestions() {
  if (state.sugg && Date.now() - state.sugg.at < 5 * 60e3) return state.sugg;
  state.suggStatus = "loading";
  let rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("books").select("publisher,volume,series,author").range(from, from + 999);
    if (error) { console.warn("Couldn't load suggestions:", error.message); state.sugg = null; state.suggStatus = "Couldn't load saved names: " + error.message; return null; }
    rows = rows.concat(data);
    if (data.length < 1000) break;
  }
  const bySeries = {};
  for (const b of rows) {
    if (!b.series?.trim() || !b.volume?.trim()) continue;
    (bySeries[b.series.trim().toLowerCase()] ||= []).push(b.volume.trim());
  }
  const sortVol = (a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0) || a.localeCompare(b);
  for (const k in bySeries) bySeries[k] = [...new Set(bySeries[k])].sort(sortVol);
  state.suggStatus = "ok";
  // For each series: its usual author and publisher (used to auto-fill); for each author: their series
  const seriesInfo = {}, authorSeries = {};
  for (const b of rows) {
    const sk = b.series?.trim().toLowerCase(); if (!sk) continue;
    const e = (seriesInfo[sk] ||= { authors: [], pubs: [] });
    e.authors.push(b.author); e.pubs.push(b.publisher);
    const ak = b.author?.trim().toLowerCase(); if (ak) (authorSeries[ak] ||= []).push(b.series);
  }
  for (const k in seriesInfo) seriesInfo[k] = { author: tally(seriesInfo[k].authors)[0] || "", publisher: tally(seriesInfo[k].pubs)[0] || "" };
  for (const k in authorSeries) authorSeries[k] = tally(authorSeries[k]);
  state.sugg = { at: Date.now(), books: rows.length, bySeries, seriesInfo, authorSeries,
    pubs: tally(rows.map(b => b.publisher)), vols: tally(rows.map(b => b.volume)).slice(0, 40),
    authors: tally(rows.map(b => b.author)), series: tally(rows.map(b => b.series)) };
  return state.sugg;
}

/* ---------- duplicate check ---------- */
async function findDuplicates({ isbn, title, author, volume }) {
  const exact = v => v.replace(/[\\%_]/g, m => "\\" + m);   // match the whole text, case-insensitive
  let q = sb.from("books")
    .select("id,title,author,volume,isbn,image_path,created_at,owner:owners(name),room:rooms(name),area:areas(name)")
    .order("created_at").limit(10);
  if (isbn) q = q.eq("isbn", isbn);
  else {
    q = q.ilike("title", exact(title)).ilike("author", exact(author));
    q = volume ? q.ilike("volume", exact(volume)) : q.is("volume", null);   // Vol. 1 and Vol. 2 are different books
  }
  const { data, error } = await q;
  if (error) { toast(friendly(error), true); return []; }
  return data;
}

// Shows the matches; resolves "copy", "edit:<id>" or null (cancel)
async function chooseDuplicate(dups, what) {
  const urls = await signedUrls(dups.map(d => d.image_path));
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dupTitle">
      <h3 id="dupTitle">${dups.length === 1 ? "Already in the library" : `${dups.length} copies already in the library`}</h3>
      <p class="stat">${esc(what)} is already catalogued. Edit the existing entry, or add another copy?</p>
      <ul class="duplist">${dups.map(d => `
        <li>
          ${urls[d.image_path] ? `<img src="${esc(urls[d.image_path])}" alt="">` : `<span class="noimg small"></span>`}
          <div class="dupinfo"><strong>${esc(d.title)}${d.volume ? `, Vol. ${esc(d.volume)}` : ""}</strong><br>
            <span class="stat">${esc(d.author)}</span><br>
            <span class="stat">${esc([d.room?.name, d.area?.name].filter(Boolean).join(" / ") || "Not shelved yet")}${d.owner?.name ? `, ${esc(d.owner.name)}` : ""}</span></div>
          <button class="btn small" data-v="edit:${esc(d.id)}">Edit &amp; overwrite</button>
        </li>`).join("")}</ul>
      <div class="actions">
        <button class="btn" data-v="copy">Add a new copy</button>
        <button class="btn ghost" data-v="">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("[data-v]").focus();
  return new Promise(resolve => {
    const done = v => { wrap.remove(); document.removeEventListener("keydown", onKey); resolve(v || null); };
    const onKey = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", onKey);
    wrap.addEventListener("click", e => {
      if (e.target === wrap) return done(null);
      const b = e.target.closest("[data-v]"); if (b) done(b.dataset.v);
    });
  });
}

/* ---------- barcode scan + ISBN lookup ---------- */
const cleanIsbn = v => String(v || "").replace(/[\s-]/g, "").toUpperCase();
function isValidIsbn(s) {
  if (/^\d{13}$/.test(s)) {
    const sum = [...s].reduce((t, d, i) => t + (+d) * (i % 2 ? 3 : 1), 0);
    return sum % 10 === 0;
  }
  if (/^\d{9}[\dX]$/.test(s)) {
    const sum = [...s].reduce((t, d, i) => t + (d === "X" ? 10 : +d) * (10 - i), 0);
    return sum % 11 === 0;
  }
  return false;
}

// Pull a 4-digit year out of "2010", "2010-05-01", "May 2010", "c1998" etc.
const yearOf = d => { const m = String(d || "").match(/(?<!\d)(1[5-9]\d{2}|20\d{2})(?!\d)/); return m && +m[1] <= new Date().getFullYear() + 1 ? m[1] : ""; };

// Turn Google Books categories into one of our genres; leave blank when it isn't clear
function genreOf(categories) {
  const c = (categories || []).join(" | ").toLowerCase();
  if (!c) return "";
  let g = "";
  if (/manga/.test(c)) g = "Manga";
  else if (/biograph|memoir/.test(c)) g = "Biography";
  else if (/\bhistor/.test(c) && !/fiction/.test(c)) g = "History";
  else if (/non-?fiction/.test(c)) g = "Non-Fiction";
  else if (/fiction/.test(c)) g = "Fiction";
  else if (/business|econom|self-help|science|technolog|law|cook|health|education|psycholog|reference|politic|religio|philosoph|computer|mathemat|travel|management|finance|medical|language arts/.test(c)) g = "Non-Fiction";
  return GENRES.includes(g) ? g : "";
}

// Every book with an ISBN-10 also has an ISBN-13 (978…). Databases often hold only one form, so try both.
function isbnForms(isbn) {
  const s = cleanIsbn(isbn), forms = [s];
  const to13 = d12 => d12 + (10 - [...d12].reduce((t, d, i) => t + +d * (i % 2 ? 3 : 1), 0) % 10) % 10;
  const to10 = d9 => { const c = (11 - [...d9].reduce((t, d, i) => t + +d * (10 - i), 0) % 11) % 11; return d9 + (c === 10 ? "X" : c); };
  if (s.length === 10) forms.push(to13("978" + s.slice(0, 9)));
  if (s.length === 13 && s.startsWith("978")) forms.push(to10(s.slice(3, 12)));
  return forms;
}

// Ask several free book databases at the same time and combine what they know.
// Order of trust: Google Books, Open Library (edition record), Open Library (search index), Crossref.
async function lookupIsbn(isbn) {
  const forms = isbnForms(isbn), i13 = forms.find(f => f.length === 13) || forms[0];
  const getJSON = (url, ms = 8000) => Promise.race([
    fetch(url).then(r => (r.ok ? r.json() : null)),
    new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms)),
  ]);
  const authorsOf = list => (list || []).filter(Boolean).join(", ");

  const sources = [
    // 1. Google Books (tries each ISBN form until one answers)
    (async () => {
      for (const f of forms) {
        const v = (await getJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:${f}`))?.items?.[0]?.volumeInfo;
        if (v?.title) return { source: "Google Books", title: [v.title, v.subtitle].filter(Boolean).join(": "), author: authorsOf(v.authors),
          year: yearOf(v.publishedDate), publisher: v.publisher || "", genre: genreOf(v.categories),
          cover: v.imageLinks?.thumbnail?.replace(/^http:/, "https:").replace("&edge=curl", "") };
      }
      return null;
    })(),
    // 2. Open Library edition record (both ISBN forms in one request)
    getJSON(`https://openlibrary.org/api/books?bibkeys=${forms.map(f => "ISBN:" + f).join(",")}&format=json&jscmd=data`).then(d => {
      const v = forms.map(f => d?.[`ISBN:${f}`]).find(Boolean);
      return v?.title ? { source: "Open Library", title: [v.title, v.subtitle].filter(Boolean).join(": "), author: authorsOf((v.authors || []).map(a => a.name)),
        year: yearOf(v.publish_date), publisher: v.publishers?.[0]?.name || "", genre: genreOf((v.subjects || []).map(x => x.name)),
        cover: v.cover?.large || v.cover?.medium } : null;
    }),
    // 3. Open Library search index (finds some books the edition record misses)
    getJSON(`https://openlibrary.org/search.json?isbn=${i13}&fields=title,subtitle,author_name,first_publish_year,publisher,cover_i,subject&limit=1`).then(d => {
      const v = d?.docs?.[0];
      return v?.title ? { source: "Open Library", title: [v.title, v.subtitle].filter(Boolean).join(": "), author: authorsOf(v.author_name),
        year: "", firstYear: v.first_publish_year ? String(v.first_publish_year) : "",   // first-ever publication, used only as a last resort
        publisher: v.publisher?.[0] || "", genre: genreOf(v.subject),
        cover: v.cover_i ? `https://covers.openlibrary.org/b/id/${v.cover_i}-L.jpg` : "" } : null;
    }),
    // 4. Crossref (strong on academic, technical and reference books)
    getJSON(`https://api.crossref.org/works?filter=isbn:${i13}&rows=1&select=title,author,editor,publisher,issued`).then(d => {
      const v = d?.message?.items?.[0];
      const people = (v?.author || v?.editor || []).map(a => [a.given, a.family].filter(Boolean).join(" ") || a.name);
      return v?.title?.[0] ? { source: "Crossref", title: v.title[0], author: authorsOf(people),
        year: yearOf(v.issued?.["date-parts"]?.[0]?.[0]), publisher: v.publisher || "", genre: "", cover: "" } : null;
    }),
  ];
  const found = (await Promise.allSettled(sources)).map(r => (r.status === "fulfilled" ? r.value : null)).filter(Boolean);

  // Take the most trusted answer, then fill any gaps from the others
  const hit = found.length ? { ...found[0] } : {};
  const used = new Set(found.length ? [found[0].source] : []);
  for (const k of ["author", "year", "publisher", "genre"]) {
    if (hit.title && !hit[k]) { const o = found.find(x => x[k]); if (o) { hit[k] = o[k]; used.add(o.source); } }
  }
  if (hit.title && !hit.year) { const o = found.find(x => x.firstYear); if (o) { hit.year = o.firstYear; used.add(o.source); } }
  if (hit.title) hit.source = [...used].join(" + ");

  // Cover candidates, best first: Open Library large covers, Open Library by ISBN, Google Books thumbnail (small)
  hit.covers = [
    ...found.filter(x => x.source === "Open Library" && x.cover).map(x => ({ url: x.cover, source: "Open Library" })),
    ...forms.map(f => ({ url: `https://covers.openlibrary.org/b/isbn/${f}-L.jpg?default=false`, source: "Open Library" })),
    ...found.filter(x => x.source === "Google Books" && x.cover).map(x => ({ url: x.cover, source: "Google Books" })),
  ];
  return hit;
}

// Load an image to check it's a real cover (not missing, not a 1px placeholder)
function probeImage(url, ms = 8000) {
  return new Promise(res => {
    const i = new Image(); const t = setTimeout(() => res(null), ms);
    i.onload = () => { clearTimeout(t); res(i.naturalWidth >= 40 && i.naturalHeight >= 40 ? { w: i.naturalWidth, h: i.naturalHeight } : null); };
    i.onerror = () => { clearTimeout(t); res(null); };
    i.src = url;
  });
}

// Gather cover choices: this exact ISBN first, then other editions of the same title/author
async function findCoverOptions({ isbn, title, author, seeds = [] }) {
  const list = [...seeds];
  if (isbn) list.push({ url: `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`, source: "Open Library" });
  const getJSON = url => Promise.race([fetch(url).then(r => r.ok ? r.json() : null), new Promise(r => setTimeout(() => r(null), 8000))]).catch(() => null);
  if (title) {
    const t = encodeURIComponent(title), a = encodeURIComponent((author || "").split(",")[0]);
    const [ol, gb] = await Promise.all([
      getJSON(`https://openlibrary.org/search.json?title=${t}${a ? `&author=${a}` : ""}&fields=cover_i&limit=20`),
      getJSON(`https://www.googleapis.com/books/v1/volumes?q=intitle:${t}${a ? `+inauthor:${a}` : ""}&maxResults=12`),
    ]);
    [...new Set((ol?.docs || []).map(d => d.cover_i).filter(Boolean))].slice(0, 6)
      .forEach(id => list.push({ url: `https://covers.openlibrary.org/b/id/${id}-L.jpg`, source: "Open Library" }));
    (gb?.items || []).map(i => i.volumeInfo?.imageLinks?.thumbnail).filter(Boolean).slice(0, 4)
      .forEach(u => list.push({ url: u.replace(/^http:/, "https:").replace("&edge=curl", ""), source: "Google Books" }));
  }
  const unique = list.filter((c, i) => c && list.findIndex(x => x.url === c.url) === i).slice(0, 12);
  const sizes = await Promise.all(unique.map(c => probeImage(c.url)));
  return unique.map((c, i) => sizes[i] && { ...c, ...sizes[i] }).filter(Boolean).slice(0, 8);
}

// Download a chosen cover so it's stored with the item; null if the site blocks it
async function downloadCover(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const blob = await r.blob();
    return blob.type.startsWith("image/") && blob.size > 1500 ? blob : null;
  } catch { return null; }
}

let zxingLoading;
function loadZXing() {
  if (window.ZXingBrowser) return Promise.resolve();
  return zxingLoading ||= new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js";
    s.onload = res; s.onerror = () => { zxingLoading = null; rej(new Error("Couldn't load the scanner. Check your internet connection.")); };
    document.head.appendChild(s);
  });
}

// High resolution lets the barcode be small in the frame, so the phone can sit far enough back to focus
const CAMERA = { video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false };
const ZOOMS = [1, 2, 3];
const SCAN_FORMATS = ["ean_13", "ean_8", "upc_a"];

function makeZXingReader() {
  const F = ZXingBrowser.BarcodeFormat;
  // 2 = POSSIBLE_FORMATS, 3 = TRY_HARDER (ZXing hint codes)
  return new ZXingBrowser.BrowserMultiFormatReader(new Map([[2, [F.EAN_13, F.EAN_8, F.UPC_A]], [3, true]]));
}

// One decoder for both engines: the phone's built-in detector where it exists, ZXing otherwise
async function makeDecoder() {
  if ("BarcodeDetector" in window) {
    try {
      if ((await BarcodeDetector.getSupportedFormats()).includes("ean_13")) {
        const det = new BarcodeDetector({ formats: SCAN_FORMATS });
        return async canvas => (await det.detect(canvas))[0]?.rawValue || null;
      }
    } catch {}
  }
  await loadZXing();
  const reader = makeZXingReader();
  return async canvas => { try { return reader.decodeFromCanvas(canvas).getText(); } catch { return null; } };
}

// Copy part of a frame (centred) onto a canvas, scaled to a fixed width so small barcodes get bigger bars
function cropToCanvas(canvas, src, sw, sh, fracW, fracH, outW = 1280) {
  const cw = Math.max(1, Math.round(sw * fracW)), ch = Math.max(1, Math.round(sh * fracH));
  const sx = Math.round((sw - cw) / 2), sy = Math.round((sh - ch) / 2);
  canvas.width = outW; canvas.height = Math.max(1, Math.round(outW * ch / cw));
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, sx, sy, cw, ch, 0, 0, canvas.width, canvas.height);
  return canvas;
}

// Read a barcode from a still photo (iPhone Pro models: the Camera app switches to macro for sharp close-ups)
async function decodePhoto(file) {
  const decode = await makeDecoder();
  let img;
  try { img = await createImageBitmap(file); }
  catch {
    const url = URL.createObjectURL(file);
    img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  }
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight, c = document.createElement("canvas");
  // whole photo, then the centre, then a tight centre
  for (const [fw, fh, out] of [[1, 1, 2000], [0.6, 0.4, 1600], [0.35, 0.2, 1280]]) {
    const text = await decode(cropToCanvas(c, img, w, h, fw, fh, out));
    if (text) return text;
  }
  return null;
}

// Opens the camera and resolves with a valid ISBN, or null if closed
function scanBarcode() {
  const box = document.getElementById("scanner"), video = document.getElementById("scanVideo");
  const msg = document.getElementById("scanMsg"), zoomBar = document.getElementById("scanZooms");
  const AIM = "Hold the phone about 20 cm back so it's sharp. The barcode can be small, just keep it in the box.";
  return new Promise(async resolve => {
    let stream = null, done = false, timer, helpTimer, digital = 1;
    const stop = () => { clearTimeout(timer); stream?.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null; video.style.transform = ""; };
    const finish = code => {
      if (done) return; done = true;
      clearTimeout(helpTimer); stop(); box.hidden = true; document.removeEventListener("keydown", onKey);
      if (code && navigator.vibrate) navigator.vibrate(80);
      resolve(code);
    };
    const onKey = e => { if (e.key === "Escape") finish(null); };
    const handle = text => {
      const code = cleanIsbn(text);
      if (isValidIsbn(code) && (code.length === 10 || /^97[89]/.test(code))) { finish(code); return true; }
      msg.textContent = "That barcode isn't an ISBN. Use the one with 978 or 979 above it.";
      return false;
    };

    document.getElementById("scanClose").onclick = () => finish(null);
    const fileIn = document.getElementById("scanFile");
    document.getElementById("scanPhoto").onclick = () => { fileIn.value = ""; fileIn.click(); };
    fileIn.onchange = async () => {
      const file = fileIn.files[0]; if (!file) return;
      msg.textContent = "Reading photo…";
      try {
        const text = await decodePhoto(file);
        if (!text) msg.textContent = "No barcode found in that photo. Keep it sharp and fill more of the photo with the barcode.";
        else handle(text);
      } catch { msg.textContent = "Couldn't read that photo. Try again."; }
    };
    document.addEventListener("keydown", onKey);
    zoomBar.innerHTML = ""; msg.textContent = "Starting camera…"; box.hidden = false;

    try {
      if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error("no-camera"), { name: "NoCamera" });
      const [decode, s] = await Promise.all([makeDecoder(), navigator.mediaDevices.getUserMedia(CAMERA)]);
      stream = s;
      if (done) { stop(); return; }   // closed while starting
      const track = stream.getVideoTracks()[0];
      try { await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch {}
      video.srcObject = stream; await video.play();

      // Zoom: real optical/sensor zoom when the browser offers it, otherwise enlarge the preview and crop
      const caps = track.getCapabilities?.() || {};
      const hw = caps.zoom && caps.zoom.max >= 1.5 ? caps.zoom : null;
      const setZoom = async z => {
        if (hw) {
          try { await track.applyConstraints({ advanced: [{ zoom: Math.min(hw.max, Math.max(hw.min, z)) }] }); digital = 1; video.style.transform = ""; }
          catch { digital = z; video.style.transform = `scale(${z})`; }
        } else { digital = z; video.style.transform = z > 1 ? `scale(${z})` : ""; }
        zoomBar.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.z === z)));
      };
      const levels = ZOOMS.filter(z => !hw || z <= hw.max);
      zoomBar.innerHTML = levels.map(z => `<button type="button" data-z="${z}" aria-pressed="false">${z}×</button>`).join("");
      zoomBar.querySelectorAll("button").forEach(b => b.onclick = () => setZoom(+b.dataset.z));
      await setZoom(2);   // start at 2× so people naturally hold the phone further back

      msg.textContent = AIM;
      helpTimer = setTimeout(() => { if (!done) msg.textContent = "Still looking. Try 3×, move back a little, or tap Use a photo."; }, 9000);

      const canvas = document.createElement("canvas");
      let pass = 0;
      const tick = async () => {
        if (done) return;
        if (video.readyState >= 2 && video.videoWidth) {
          const vw = video.videoWidth, vh = video.videoHeight;
          // Pass A: the area inside the box. Pass B: a tighter centre, enlarged, for small barcodes.
          const tight = pass++ % 2 === 1 ? 0.55 : 1;
          const fw = Math.min(1, (0.9 / digital) * tight);
          const fh = Math.min(1, ((vw < vh ? 0.3 : 0.5) / digital) * tight);
          const text = await decode(cropToCanvas(canvas, video, vw, vh, fw, fh));
          if (text && handle(text)) return;
        }
        if (!done) timer = setTimeout(tick, 100);
      };
      tick();
    } catch (e) {
      // Live camera failed: keep the scanner open so "Use a photo" still works
      stop(); zoomBar.innerHTML = "";
      const n = e?.name;
      msg.textContent =
        n === "NotAllowedError" || n === "SecurityError" ? "Camera access is blocked. Allow it in settings, or tap Use a photo."
        : n === "NotFoundError" || n === "OverconstrainedError" ? "No usable camera found. Tap Use a photo, or close and type the ISBN."
        : n === "NoCamera" ? "This browser can't show a live camera. Tap Use a photo."
        : "The camera didn't start (" + (e?.message || n || "unknown") + "). Tap Use a photo.";
    }
  });
}

/* ---------- find ---------- */
const ICON_SEARCH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
const ICON_FILTER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;

async function renderFind() {
  setBar({ title: "Find", back: true });
  const q = state.findQuery;
  const chipGroup = (key, values, label) => `
    <div class="fgroup"><span class="flabel">${label}</span>
      <div class="chips" data-key="${key}">${values.map(v =>
        `<button type="button" data-v="${esc(v)}" aria-pressed="${q[key] === v}">${esc(v)}</button>`).join("")}</div></div>`;
  app.innerHTML = `
    <h2>Find in catalog</h2>
    <div class="searchbar">
      <span class="sicon" aria-hidden="true">${ICON_SEARCH}</span>
      <label class="sr" for="term">Search</label>
      <input id="term" type="search" placeholder="Title, author, publisher, series or ISBN" value="${esc(q.term)}" autocomplete="off">
      <button type="button" class="fbtn" id="openF" aria-haspopup="dialog">${ICON_FILTER}<span>Filters</span><span class="badge" id="fCount" hidden></span></button>
    </div>
    <div class="segtrack" role="group" aria-label="Read status">${["", ...READ_STATUSES].map(v =>
      `<button type="button" data-status="${v}" aria-pressed="${(q.status || "") === v}">${v || "All"}</button>`).join("")}</div>
    <div class="activef" id="activeF"></div>
    <p class="stat" id="resCount"></p>
    <div id="results"></div>

    <div class="fwrap" id="fWrap" hidden>
      <div class="fsheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
        <div class="fhead"><h3 id="fTitle">Filters</h3>
          <button type="button" class="xbtn" id="closeF" aria-label="Close filters">&times;</button></div>
        <div class="fbody">
          <div class="fgroup"><span class="flabel">Owner &amp; location</span>
            <div class="fgrid">
              <label>Owner<select id="fOwner">${opts(state.owners, q.owner, "Any owner")}</select></label>
              <label>Room<select id="fRoom">${opts(state.rooms, q.room, "Any room")}</select></label>
              <label>Area<select id="fArea"></select></label>
            </div></div>
          ${chipGroup("btype", BOOK_TYPES, "Type")}
          ${chipGroup("genre", GENRES, "Genre")}
          ${chipGroup("lang", LANGUAGES, "Language")}
        </div>
        <div class="ffoot">
          <button type="button" class="btn ghost" id="clearF">Clear all</button>
          <button type="button" class="btn" id="applyF">Show results</button>
        </div>
      </div>
    </div>`;

  const $ = id => document.getElementById(id);
  const fillAreas = () => {
    const list = state.areas.filter(a => a.room_id === $("fRoom").value);
    $("fArea").innerHTML = opts(list, q.area, "Any area"); $("fArea").disabled = !$("fRoom").value;
  };
  fillAreas();

  // Active filters: shown as removable pills under the search bar, counted on the Filters button
  const ACTIVE = [
    ["owner", "Owner", v => byId(state.owners, v)?.name], ["room", "Room", v => byId(state.rooms, v)?.name],
    ["area", "Area", v => byId(state.areas, v)?.name], ["btype", "Type", v => v], ["genre", "Genre", v => v], ["lang", "Language", v => v],
  ];
  const syncControls = () => {
    $("fOwner").value = q.owner || ""; $("fRoom").value = q.room || ""; fillAreas(); $("fArea").value = q.area || "";
    app.querySelectorAll(".fsheet .chips").forEach(g => g.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", String(q[g.dataset.key] === b.dataset.v))));
  };
  const renderActive = () => {
    const on = ACTIVE.filter(([k]) => q[k]);
    $("fCount").hidden = !on.length; $("fCount").textContent = on.length;
    $("activeF").innerHTML = on.length ? on.map(([k, label, name]) =>
      `<button type="button" class="apill" data-clear="${k}" aria-label="Remove ${label} filter">${label}: <strong>${esc(name(q[k]) || "")}</strong><span aria-hidden="true">&times;</span></button>`).join("")
      + `<button type="button" class="alink" data-clear="*">Clear all</button>` : "";
    $("activeF").querySelectorAll("[data-clear]").forEach(b => b.onclick = () => {
      const k = b.dataset.clear;
      if (k === "*") ACTIVE.forEach(([key]) => (q[key] = ""));
      else { q[k] = ""; if (k === "room") q.area = ""; }
      syncControls(); run();
    });
  };

  let timer, seq = 0;
  const run = async () => {
    q.term = $("term").value;
    renderActive();
    const mine = ++seq;
    $("resCount").innerHTML = '<span class="spin" aria-hidden="true"></span> Searching…';
    // Supabase returns at most 1,000 rows per request, so fetch every page and join them
    const PAGE = 1000;
    let t = q.term.replace(/[%,()*"\\]/g, " ").trim();
    if (/^[\d\s-]+[xX]?$/.test(t)) t = t.replace(/[\s-]/g, ""); // ISBNs are stored without hyphens
    const build = (withCount = false) => {
      let query = sb.from("books")
        .select("id,title,author,series,volume,published_year,read_status,book_type,language,genre,image_path,owner:owners(name),room:rooms(name),area:areas(name)", withCount ? { count: "exact" } : undefined)
        .order("title").order("id");                      // id makes the order stable across pages
      if (t) query = query.or(["title", "author", "publisher", "series", "volume", "isbn"].map(c => `${c}.ilike."%${t}%"`).join(","));
      if (q.owner) query = query.eq("owner_id", q.owner);
      if (q.room) query = query.eq("room_id", q.room);
      if (q.area) query = query.eq("area_id", q.area);
      if (q.status) query = query.eq("read_status", q.status);
      if (q.btype) query = query.eq("book_type", q.btype);
      if (q.lang) query = query.eq("language", q.lang);
      if (q.genre) query = query.eq("genre", q.genre);
      return query;
    };
    const first = await build(true).range(0, PAGE - 1);
    let { data, error, count } = first;
    if (!error && count > PAGE) {
      const rest = [];
      for (let from = PAGE; from < count; from += PAGE) rest.push(build().range(from, from + PAGE - 1));
      for (const r of await Promise.all(rest)) { if (r.error) { error = r.error; break; } data = data.concat(r.data); }
    }
    if (mine !== seq) return;
    if (error) { $("resCount").textContent = friendly(error); return; }
    $("applyF").textContent = count === 0 ? "No matches" : `Show ${count.toLocaleString("en-IN")} result${count === 1 ? "" : "s"}`;
    $("resCount").textContent = count === 0 ? "" : `${count.toLocaleString("en-IN")} found`;
    if (!data.length) {
      $("results").innerHTML = `<div class="empty">Nothing matches that.<br><br><button class="btn" onclick="go('add')">Add a new item</button></div>`;
      return;
    }
    const urls = await signedUrls(data.map(b => b.image_path));
    if (mine !== seq) return;
    $("results").innerHTML = data.map(b => {
      const loc = [b.room?.name, b.area?.name].filter(Boolean).join(" / ");
      return `<button class="icard" data-id="${esc(b.id)}">
        ${urls[b.image_path] ? `<img class="thumb" src="${esc(urls[b.image_path])}" alt="" loading="lazy">` : `<span class="thumb" aria-hidden="true"></span>`}
        <span class="body">
          <span class="t" style="display:block">${esc(b.title)}</span>
          <span class="a" style="display:block">${esc(b.author)}${b.published_year ? `, ${b.published_year}` : ""}${b.series || b.volume ? ` (${esc([b.series, b.volume && "Vol. " + b.volume].filter(Boolean).join(", "))})` : ""}</span>
          <span class="m" style="display:block"><span class="pill ${esc(b.read_status)}">${esc(b.read_status)}</span>${esc(b.book_type)}${b.genre ? `, ${esc(b.genre)}` : ""}${b.language && b.language !== "English" ? `, ${esc(b.language)}` : ""}${b.owner?.name ? `, ${esc(b.owner.name)}` : ""}</span>
        </span>
        ${loc ? `<span class="callno">${esc(loc)}</span>` : ""}
      </button>`;
    }).join("");
    $("results").querySelectorAll(".icard").forEach(c => c.onclick = () => go("book/" + c.dataset.id));
  };

  // Search box and read-status bar
  $("term").oninput = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
  app.querySelectorAll("[data-status]").forEach(b => b.onclick = () => {
    q.status = b.dataset.status;
    app.querySelectorAll("[data-status]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    run();
  });

  // Filter sheet
  const sheet = $("fWrap");
  const openSheet = () => { sheet.hidden = false; document.body.style.overflow = "hidden"; $("closeF").focus(); };
  const closeSheet = () => { sheet.hidden = true; document.body.style.overflow = ""; $("openF").focus(); };
  $("openF").onclick = openSheet;
  $("closeF").onclick = closeSheet;
  $("applyF").onclick = closeSheet;
  sheet.onclick = e => { if (e.target === sheet) closeSheet(); };
  sheet.onkeydown = e => { if (e.key === "Escape") closeSheet(); };
  $("fOwner").onchange = () => { q.owner = $("fOwner").value; run(); };
  $("fRoom").onchange = () => { q.room = $("fRoom").value; q.area = ""; fillAreas(); run(); };
  $("fArea").onchange = () => { q.area = $("fArea").value; run(); };
  app.querySelectorAll(".fsheet .chips").forEach(g => g.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = g.dataset.key;
    q[k] = q[k] === b.dataset.v ? "" : b.dataset.v;          // tap again to turn off
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(q[k] === x.dataset.v)));
    run();
  });
  $("clearF").onclick = () => { ACTIVE.forEach(([k]) => (q[k] = "")); syncControls(); run(); };
  run();
}

  if (!b) { app.innerHTML = `<div class="empty">This item no longer exists.</div>`; return; }
  const img = b.image_path ? (await signedUrls([b.image_path]))[b.image_path] : null;
  const loc = [b.room?.name, b.area?.name].filter(Boolean).join(" / ") || "Not shelved yet";
  app.innerHTML = `
    <article class="sheet">

/* ---------- setup (admins) ---------- */
async function renderSetup(tab) {
  setBar({ title: "Setup", back: true });
  await loadLookups();
  const tabs = [["rooms", "Rooms"], ["areas", "Areas"], ["owners", "Owners"], ["covers", "Covers"]];
  app.innerHTML = `
    <h2>Setup</h2>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) =>
      `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="pane"></div>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => history.replaceState(null, "", "#setup/" + b.dataset.tab) || renderSetup(b.dataset.tab));
  const pane = document.getElementById("pane");
  const refresh = () => renderSetup(tab);
  if (tab === "covers") return renderCoversTab(pane);

  const rowActions = (table, item, extra = "") => `
    <li data-id="${esc(item.id)}">
      <span class="name">${esc(item.name)} ${extra}</span>
      ${table === "owners" ? (item.is_default ? `<span class="badge">Default</span>` : `<button class="btn ghost small" data-act="default">Make default</button>`) : ""}
      <button class="btn ghost small" data-act="rename">Rename</button>
      <button class="btn danger small" data-act="delete">Delete</button>
    </li>`;

  const wire = (table) => pane.querySelectorAll("li[data-id]").forEach(li => {
    const id = li.dataset.id, item = byId(state[table], id);
    li.querySelectorAll("[data-act]").forEach(btn => btn.onclick = async () => {
      const act = btn.dataset.act;
      if (act === "delete") {
        const warn = table === "rooms" ? " All areas inside it will also be removed." : "";
        if (!confirm(`Delete "${item.name}"?${warn}`)) return;
        const { error } = await sb.from(table).delete().eq("id", id);
        if (error) return toast(friendly(error), true);
        toast("Deleted"); refresh();
      } else if (act === "default") {
        const { error } = await sb.rpc("set_default_owner", { p_owner: id });
        if (error) return toast(friendly(error), true);
        toast(`${item.name} is now the default owner`); refresh();
      } else if (act === "rename") {
        li.innerHTML = `<input type="text" value="${esc(item.name)}" aria-label="New name" style="flex:1;min-width:10rem">
          <button class="btn small" data-x="save">Save</button><button class="btn ghost small" data-x="cancel">Cancel</button>`;
        const inp = li.querySelector("input"); inp.focus(); inp.select();
        li.querySelector('[data-x="cancel"]').onclick = refresh;
        const save = async () => {
          const name = inp.value.trim(); if (!name) return;
          const { error } = await sb.from(table).update({ name }).eq("id", id);
          if (error) return toast(friendly(error), true);
          toast("Renamed"); refresh();
        };
        li.querySelector('[data-x="save"]').onclick = save;
        inp.onkeydown = e => { if (e.key === "Enter") save(); if (e.key === "Escape") refresh(); };
      }
    });
  });

  const addForm = (placeholder, extra = "") => `
    <form class="addrow" id="addForm">${extra}
      <input id="newName" type="text" placeholder="${placeholder}" aria-label="${placeholder}" required>
      <button class="btn" type="submit">Add</button></form>`;

  if (tab === "rooms") {
    pane.innerHTML = addForm("New room, e.g. Commissary office") +
      (state.rooms.length ? `<ul class="list">${state.rooms.map(r =>
        rowActions("rooms", r, `<span class="stat">(${state.areas.filter(a => a.room_id === r.id).length} areas)</span>`)).join("")}</ul>`
        : `<div class="empty">No rooms yet. Add the first one above.</div>`);
    wire("rooms");
  } else if (tab === "areas") {
    if (!state.rooms.length) { pane.innerHTML = `<div class="empty">Add a room first, then add areas inside it.</div>`; return; }
    pane.innerHTML = addForm("New area, e.g. Shelf B, top row",
      `<select id="areaRoom" aria-label="Room">${opts(state.rooms, state._lastRoom || state.rooms[0].id)}</select>`) +
      `<ul class="list">${state.rooms.map(r => {
        const list = state.areas.filter(a => a.room_id === r.id);
        return `<li class="group">${esc(r.name)}</li>` + (list.length ? list.map(a => rowActions("areas", a)).join("") : `<li class="stat">No areas</li>`);
      }).join("")}</ul>`;
    wire("areas");
  } else {
    pane.innerHTML = addForm("New owner, e.g. Accounts team") +
      `<p class="hint">The default owner is pre-selected on the Add form.</p>` +
      (state.owners.length ? `<ul class="list">${state.owners.map(o => rowActions("owners", o)).join("")}</ul>`
        : `<div class="empty">No owners yet. Add the first one above.</div>`);
    wire("owners");
  }

  const f = document.getElementById("addForm");
  f.onsubmit = async e => {
    e.preventDefault();
    const name = f.newName.value.trim(); if (!name) return;
    await busy(f.querySelector("button"), async () => {
      let row = { name }, table = tab;
      if (tab === "areas") { row.room_id = f.areaRoom.value; state._lastRoom = row.room_id; }
      if (tab === "owners" && !state.owners.length) row.is_default = true; // first owner becomes default
      const { error } = await sb.from(table).insert(row);
      if (error) return toast(friendly(error), true);
      toast("Added"); refresh();
    });
  };
}

/* ---------- start ---------- */
(async function init() {
  if (!window.supabase || SUPABASE_URL.includes("YOUR-PROJECT")) {
    app.innerHTML = `<div class="empty" style="margin-top:10vh"><strong>Almost there.</strong><br>
      Open index.html and paste your Supabase project URL and anon key into the CONFIG section at the top of the script.</div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange(evt => { if (evt === "SIGNED_OUT" && state.user) showLogin(); });
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await afterLogin(session.user); else showLogin();
  } catch (e) { showLogin(); toast(friendly(e), true); }
})();
</script>
</body>
